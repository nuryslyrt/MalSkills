    decisions:
      - question: "What are the pipeline stages?"
        chosen: "4-stage linear pipeline: ingestion -> threat-analysis -> correlation -> report"
        reasoning: "Each stage has a clear input/output boundary. Ingestion provides raw material, threat analysis provides per-file findings, correlation provides cross-skill insights, and reporting produces the deliverable. Linear dependency chain prevents data gaps."
      - question: "Should we use workers?"
        chosen: "No workers - each expert handles its bounded task directly"
        reasoning: "Each expert has a clear, bounded task. Over-decomposition would waste subagent spawns without improving quality. The threat-analysis-expert needs full context of all threat patterns. The correlation-expert needs holistic view of all findings. Workers would fragment these contexts."
      - question: "Concurrency model?"
        chosen: "Sequential, max_parallel=1"
        reasoning: "Strictly linear pipeline - each stage's output is the next stage's input. No parallelism is possible at the expert level."

