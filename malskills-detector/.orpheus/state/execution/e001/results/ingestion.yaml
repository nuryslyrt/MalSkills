        LiteRTAgent is a SwiftUI iOS application (iOS 17+, XcodeGen-based build) that runs
        on-device LLM inference via Google's LiteRT-LM SDK (v0.12.0). It provides a chat
        interface backed by Gemma 4, with native tool-calling capability for device actions
        (messaging, email, phone calls, calendar, reminders, maps, web search, URL opening).
      
        Architecture is well-modularized into six logical groups:
      
        - **App** (LiteRTAgentApp.swift): Entry point and AppState which manages model
          lifecycle, GPU/CPU backend fallback, and conversation (re)configuration.
        - **Engine** (LiteRTEngine.swift): The sole LiteRT-LM SDK touchpoint. An actor
          wrapping Engine and Conversation, with streaming support.
        - **Chat** (ChatViewModel, ChatModels, ChatStore): MVVM chat layer with persistence
          (JSON per session in Application Support/Chats), history replay, and action-bubble
          integration.
        - **Models** (ModelCatalog, ModelManager): Model catalog, HuggingFace download with
          byte-accurate progress, and on-disk caching with intelligent .litertlm file discovery.
        - **Actions** (ActionTools, DeviceAction, ActionRuntime, ActionExecutor, SkillCatalog,
          WebServices): Tool definitions conforming to LiteRT-LM's Tool protocol, a typed
          DeviceAction enum, confirmation gate via ActionRuntime, and execution via iOS APIs.
          Web search implements a Tavily/Serper/DuckDuckGo fallback chain.
        - **UI** (ContentView, ChatView, ConfigView, HistoryView, ModelsView, SettingsView,
          SkillsView): SwiftUI tab-based interface with live test-bench capabilities for
          prompt/sampling tuning.
      
