          category: bug
          severity: medium
          description: |
            `openMapsSearch()` uses the callback-based `MKLocalSearch.start()` API and returns
            `.launched(...)` immediately, before the search completes. The completion handler
            explicitly ignores the error parameter (`response, _ in`). If the search fails, the
            fallback `UIApplication.shared.open()` in the else branch fires, which is fine — but
            the outer caller (ActionRuntime) has already reported success to the model. Additionally,
            the completion handler calls `UIApplication.shared.open()` which may not be on the main
            thread, though UIKit typically dispatches this safely.
          suggested_fix: |
            Convert to async/await using MKLocalSearch's async API (available iOS 16+):
            ```swift
            private func openMapsSearch(_ query: String) async -> Result {
                let req = MKLocalSearch.Request()
                req.naturalLanguageQuery = query
                do {
                    let response = try await MKLocalSearch(request: req).start()
                    if let item = response.mapItems.first {
                        item.openInMaps()
                    }
                } catch {
                    let q = query.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? ""
                    if let url = URL(string: "https://maps.apple.com/?q=\(q)") {
                        UIApplication.shared.open(url)
                    }
                }
                return .launched("Opening Maps for \"\(query)\".")
            }
            ```
      
