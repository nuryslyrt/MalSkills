          category: best-practice
          severity: high
          description: |
            The HuggingFace access token is stored in plaintext UserDefaults
            (`UserDefaults.standard.string(forKey: "hfToken")`). UserDefaults is an unencrypted
            plist file on disk, readable by any process with file-system access or via device
            backups. Bearer tokens are sensitive credentials that should be stored in the iOS
            Keychain, which provides hardware-backed encryption.
          suggested_fix: |
            Replace the UserDefaults storage with a Keychain wrapper. Use Security framework directly
            or a lightweight wrapper:
            ```swift
            import Security
            private enum KeychainHelper {
                static func save(_ value: String, forKey key: String) { ... }
                static func load(forKey key: String) -> String? { ... }
                static func delete(forKey key: String) { ... }
            }
            ```
            Then change the hfToken property to read/write through the Keychain helper instead of
            UserDefaults.
      
