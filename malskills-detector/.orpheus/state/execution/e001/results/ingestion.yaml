            jailbroken device or via an iTunes backup, this token is trivially
            extractable. HuggingFace tokens grant read (and potentially write)
            access to the user's HF account and private repos.
          suggested_fix: >
            Store the token in the iOS Keychain using Security framework or a thin
            wrapper like KeychainAccess. Replace the UserDefaults read/write in the
            `hfToken` property with Keychain get/set calls:
