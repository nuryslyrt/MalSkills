              per conversation) and filter the subscription by the current sessionID,
              so action bubbles only appear in the chat that caused them.
          - file: Sources/Chat/ChatViewModel.swift
            line: 62
            category: bug
            severity: low
            description: >
              During streaming, chunks are appended to messages[assistantIndex] guarded
              by indices.contains. If a tool executes mid-stream it appends an .action
              message (via the history sink), shifting no indices (append is at end) —
              OK — but persist() is called on every action while streaming, writing
              partial assistant text to disk repeatedly. Frequent disk writes per token
              stream on large transcripts.
            suggested_fix: >
              Debounce/throttle persist() during active generation (persist once on
              completion and on action commit), rather than on every history event.
          - file: Sources/Chat/ChatStore.swift
            line: 84
            category: bug
            severity: low
            description: >
              loadAll() uses Data(contentsOf:) synchronously on the main actor (init)
              and try? silently drops any session file that fails to decode (e.g. a
              schema change). Corrupt/legacy files vanish with no user feedback, and
              loading many/large session files blocks app launch on the main thread.
            suggested_fix: >
              Load sessions off the main actor (Task/background) and log or surface
              decode failures instead of silently discarding, or migrate legacy schemas
              explicitly.
      
          # ---------- ModelCatalog.swift ----------
          - file: Sources/Models/ModelCatalog.swift
            line: 76
            category: best-practice
            severity: low
            description: >
              AgentSettings.load() decodes ModelSpec-embedded settings from
              UserDefaults keyed "AgentSettings.v2". Because the persisted orchestrator
              is a full ModelSpec snapshot, if the catalog's spec changes (repo, size,
              hint) a user keeps the stale embedded copy indefinitely with no
              reconciliation against ModelCatalog.all.
            suggested_fix: >
              Persist only the orchestrator id and resolve against ModelCatalog.all on
              load (falling back to default if the id is gone), so catalog edits
              propagate to existing installs.
      
          # ---------- Config / project.yml ----------
          - file: project.yml
            line: 32
            category: best-practice
            severity: info
            description: >
              The SwiftPM dependency product name is marked "VERIFY" with candidate
              names in a comment, and the package is pinned to a raw revision SHA with
              a note that tag resolution fails. This is a known-fragile external dep
              that will silently break the build if the product name is wrong or the
              LFS repo state changes.
            suggested_fix: >
              Once verified, remove the VERIFY comment and document the confirmed
              product name; consider vendoring or mirroring the pinned revision to
