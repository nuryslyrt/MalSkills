          severity: medium
          description: >
            openMapsSearch() uses the callback-based MKLocalSearch.start() API and
            returns .launched("Opening Maps...") immediately before the search
            completes. If the search finds no results, the fallback URL is opened
            inside the callback, but the model has already received the "launched"
            result. This mismatch means the model cannot know whether the search
            succeeded or fell back. More importantly, errors in the callback
            (e.g., network failure) are silently ignored.
          suggested_fix: >
            Convert to async/await using MKLocalSearch's async start() method
            (available since iOS 16) so the result accurately reflects what happened:
              private func openMapsSearch(_ query: String) async -> Result {
                  let req = MKLocalSearch.Request()
                  req.naturalLanguageQuery = query
                  do {
                      let response = try await MKLocalSearch(request: req).start()
                      if let item = response.mapItems.first {
                          item.openInMaps()
                          return .launched("Opened Maps for \"\(query)\".")
                      }
                  } catch { /* fall through to URL fallback */ }
                  let q = query.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? ""
                  UIApplication.shared.open(URL(string: "http://maps.apple.com/?q=\(q)")!)
                  return .launched("Opening Maps for \"\(query)\" (via URL fallback).")
              }
      
