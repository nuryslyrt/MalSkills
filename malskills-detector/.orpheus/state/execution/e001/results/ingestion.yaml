          - file: Sources/App/Info.plist
            line: 48
            category: best-practice
            severity: info
            description: >
              LSApplicationQueriesSchemes whitelists tel/sms/mailto/maps/http/https but
              OpenAppTool lets the model open arbitrary URL schemes (e.g. music://).
              canOpenURL for a scheme not in this list returns false, so many
              legitimate app-open requests will be reported as "Can't open app" even
              though the intent is valid — inconsistent capability vs. advertised skill.
            suggested_fix: >
              Either broaden the query-schemes list to the app schemes you intend to
              support, or set the open_app skill's expectations (and its example) to the
              whitelisted set, and handle the canOpenURL-false case with a clearer
              message.
      
        summary: >
          LiteRTAgent is a well-organized, idiomatic SwiftUI on-device LLM agent with a
          clean separation between pure action data (DeviceAction), SDK tool
          conformances (ActionTools), a runtime bridge (ActionRuntime), and Apple-API
          execution (ActionExecutor). Documentation comments are unusually good and
          explain non-obvious SDK constraints. The most important issues are: (1)
          several force-unwrapped/unencoded URL constructions built from external data
          (HuggingFace filenames, model-supplied URLs) that can crash or be abused
          (ModelManager line 67, WebServices line 137); (2) concurrency/threading
          hazards — an uncancellable streaming Task in LiteRTEngine, a mixed-isolation
          non-@MainActor ActionRuntime singleton, and an off-main-thread MapKit
          completion touching UIKit; (3) the global ActionRuntime singleton and global
          action-history feed that can surface actions in the wrong chat session and
          blocks multi-conversation/testability; and (4) dead state (ModelManager.tasks)
          implying a download-cancel feature that doesn't exist, so deleting a model
          mid-download resurrects it. No critical security holes given iOS sandboxing
          and the user-confirmation gate, but the URL-injection/force-unwrap items and
          the mismatch between advertised skills (Contacts lookup, arbitrary app open)
          and actual behavior should be addressed. 27 findings: 0 critical, 5 high,
          10 medium, 8 low, 4 info.
      

