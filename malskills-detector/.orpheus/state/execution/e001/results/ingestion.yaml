        structure_overview: |
          LiteRTAgent is a SwiftUI iOS/iPad app (deployment target iOS 17, Swift 5.9,
          project generated via XcodeGen from project.yml) that runs a Gemma model
          on-device using Google's LiteRT-LM Swift SDK and exposes device "skills"
          (messaging, email, calls, calendar, reminders, maps, web search/fetch, app
          launch) to the model as tool calls. It is a single-target app with a clean,
          layered structure:
      
          - Sources/App: App entry point (LiteRTAgentApp) and AppState — the central
            @MainActor ObservableObject that loads the model, configures the
            conversation (system prompt + sampler + tools + history), and handles
            GPU->CPU fallback. Plus Info.plist (permission strings, LSApplication
            QueriesSchemes) and entitlements (increased-memory-limit).
          - Sources/Engine: LiteRTEngine — the only file that imports LiteRTLM. An
            actor wrapping Engine/Conversation with streaming generation.
          - Sources/Models: ModelCatalog (ModelSpec + AgentSettings persistence) and
            ModelManager (HuggingFace discovery + delegate-based file download).
          - Sources/Actions: The tool/action layer. DeviceAction (the action enum),
            ActionTools (LiteRTLM Tool conformances), ActionRuntime (shared bridge
            with confirmation gate + history), ActionExecutor (Apple-API execution),
            SkillCatalog (skill metadata), WebServices (search/fetch providers).
          - Sources/Chat: ChatModels (ChatMessage/ChatSession), ChatStore (per-session
            JSON persistence), ChatViewModel (streaming + action bubble surfacing).
          - Sources/UI: SwiftUI views — ContentView (TabView), ChatView, ConfigView
            (test bench), ModelsView, SettingsView, HistoryView, SkillsView.
      
          Architecture is generally idiomatic modern Swift: actors for the engine,
          @MainActor isolation for UI-facing state, Combine for the action history
          stream, value-type tools decoded by the SDK reaching a shared runtime. The
          separation of DeviceAction (pure data) from ActionExecutor (side effects) is
          a strong point. Main risks cluster around the singleton ActionRuntime (global
          mutable state, no per-conversation isolation), URL construction using
          force-unwraps, and a couple of concurrency/threading subtleties.
      
