              private let approvalLock = AsyncSemaphore(value: 1)
              func perform(_ action: DeviceAction) async -> String {
                  if !action.isReadOnly, await shouldConfirm() {
                      await approvalLock.wait()
                      defer { approvalLock.signal() }
                      let approved = await requestApproval(action)
                      // ...
