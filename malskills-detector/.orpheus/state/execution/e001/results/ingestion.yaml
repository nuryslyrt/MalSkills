          line: 8
          category: best-practice
          severity: high
          description: |
            API keys for Tavily, Serper, and Jina are stored via @AppStorage (backed by UserDefaults)
            in plaintext. These are third-party API credentials that grant access to paid services.
            The same concern applies as with the HF token: UserDefaults is unencrypted and accessible
            in device backups. The README even notes "use a backend proxy for App Store distribution,"
            but the current storage is insecure even for development.
          suggested_fix: |
            Store all API keys in the iOS Keychain. Replace @AppStorage bindings with a custom
            Binding that reads/writes through a Keychain helper. Example:
            ```swift
            private var tavilyKeyBinding: Binding<String> {
                Binding(
