  - path: ".orpheus/experts/review-expert/SKILL.md"
    absolute_path: "/Users/glitchwarden/Documents/DEFCON34_Prep/orphys/TestBeds/TestBed5/code-reviewer/.orpheus/experts/review-expert/SKILL.md"
    classification: skill_definition
