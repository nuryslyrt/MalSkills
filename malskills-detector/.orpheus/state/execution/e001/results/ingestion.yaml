              ```swift
              func stream(_ text: String) -> AsyncThrowingStream<String, Error> {
                  AsyncThrowingStream { continuation in
                      let task = Task {
                          guard let conversation else {
                              continuation.finish(throwing: EngineError.notReady); return
                          }
                          do {
                              for try await chunk in conversation.sendMessageStream(Message(text)) {
                                  try Task.checkCancellation()
                                  continuation.yield(chunk.toString)
                              }
                              continuation.finish()
                          } catch {
                              continuation.finish(throwing: error)
                          }
                      }
                      continuation.onTermination = { _ in task.cancel() }
                  }
              }
